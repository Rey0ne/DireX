<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>数据检查</title></head><body>
<h2>IndexedDB 数据检查</h2>
<div id="result">检查中...</div>
<script>
(async () => {
  const out = document.getElementById('result');
  try {
    const DBOpenRequest = indexedDB.open('tapnow-canvas');
    DBOpenRequest.onerror = (e) => { out.innerHTML = '无法打开数据库: ' + e.target.error; };
    DBOpenRequest.onsuccess = (e) => {
      const db = e.target.result;
      const tx = db.transaction(['nodes', 'edges', 'canvases'], 'readonly');
      const nodesStore = tx.objectStore('nodes');
      Promise.all([
        new Promise(r=>{const q=nodesStore.count();q.onsuccess=()=>r({key:'nodes',count:q.result});}),
        new Promise(r=>{const q=tx.objectStore('edges').count();q.onsuccess=()=>r({key:'edges',count:q.result});}),
        new Promise(r=>{const q=tx.objectStore('canvases').getAll();q.onsuccess=()=>r({key:'canvases',list:q.result});}),
        new Promise(r=>{const q=nodesStore.getAll(null,5);q.onsuccess=()=>r({key:'sample',list:q.result});}),
      ]).then(results=>{
        let html='';
        results.forEach(r=>{
          if(r.key==='nodes')html+='<p>节点表: <b>'+r.count+'</b> 条</p>';
          if(r.key==='edges')html+='<p>连线表: <b>'+r.count+'</b> 条</p>';
          if(r.key==='canvases')html+='<p>画布表: <b>'+r.list.length+'</b> 条</p>'+r.list.map(c=>'<p>&nbsp;&nbsp;id='+c.id+' projectId='+c.projectId+'</p>').join('');
          if(r.key==='sample')html+='<p>示例节点:</p><ul>'+r.list.map(n=>'<li>'+n.id+' | '+n.type+' | '+(n.title||'')+' | canvasId='+(n.canvasId||'?')+'</li>').join('')+'</ul>';
        });
        out.innerHTML=html;
      });
    };
  } catch(e) { out.innerHTML = '错误: ' + e.message; }
})();
</script>
</body></html>
